name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Dynalist parity: replays the recorded Dynalist results (qa/golden) against this build.
  # No network access to Dynalist is needed; fails only on regressions. See qa/PLAN.md.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run qa:serve
      - run: npm run qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-report
          path: qa/out
          retention-days: 14
