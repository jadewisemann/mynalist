name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # the look's generated files (design/build.mjs) match design/*.toml
      - run: node design/build.mjs --check
      - run: npm run typecheck
      - run: npm test

  # The Rust port of packages/core (native/), checked against fixtures recorded from the TS core.
  native-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: node native/crates/outliner-core/fixtures/gen.ts && node native/crates/outliner-core/fixtures/gen-commands.ts && node native/crates/outliner-core/fixtures/gen-inline.ts
      - run: cargo test -p outliner-core -p outliner-app
        working-directory: native
      - run: cargo clippy -p outliner-core -p outliner-app --all-targets -- -D warnings
        working-directory: native

  # Dynalist parity: replays the recorded Dynalist results (qa/golden) against this build.
  # No network access to Dynalist is needed; fails only on regressions. See qa/PLAN.md.
  parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run qa:serve
      - run: npm run qa
      # the shared render model: the web's model of the native fixtures equals the native snapshot's, and both
      # keep design/spec.json (the native side is checked by native-core's snapshot test)
      - run: npm run qa:model
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parity-report
          path: qa/out
          retention-days: 14
