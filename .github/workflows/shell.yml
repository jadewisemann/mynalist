name: shell

# Builds the Tauri shell (apps/shell) for macOS, Linux and Android.
#
# This workflow exists because the macOS build cannot run on the Linux dev box
# (no Xcode). The macOS runner does it instead. The three jobs are independent
# on purpose: a macOS failure must not hide the Android result.
#
# UNSIGNED (ad-hoc) BUILDS. There is no Apple Developer ID certificate and no
# Android release keystore in this repo, so:
#   * the .dmg/.app are AD-HOC signed (`signingIdentity: "-"` in
#     src-tauri/tauri.conf.json). That matters: on Apple Silicon, an app with no
#     signature at all is reported by macOS as "damaged and can't be opened",
#     which `xattr` does not reliably fix. An ad-hoc signature gets the normal
#     "unidentified developer" prompt instead, which the user can bypass with
#     right-click > Open, or:
#         xattr -d com.apple.quarantine /Applications/Outliner.app
#     They are NOT notarized, so this prompt appears every download.
#   * the Android APK is a debug build (signed with the throwaway debug key),
#     installable via `adb install` but not uploadable to Play.
# Real signing is a product decision, not a build detail, so it is left out.
# See "Enabling signing" at the bottom of this file for where it would go.

on:
  push:
    branches: [main]
    paths:
      - 'apps/shell/**'
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/shell.yml'
  pull_request:
    paths:
      - 'apps/shell/**'
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/shell.yml'
  workflow_dispatch:

concurrency:
  group: shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # macOS: the deliverable. Produces a universal .app + .dmg.
  # ---------------------------------------------------------------------------
  macos:
    name: macOS (universal .app + .dmg)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # The Rust toolchain on macOS runners is preinstalled; this pins it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/shell/src-tauri/target
          key: macos-cargo-${{ hashFiles('apps/shell/src-tauri/Cargo.lock') }}
          restore-keys: macos-cargo-

      # apps/web/dist is gitignored, so the assets the shell embeds must be
      # built here. Doing it first is mandatory: Tauri fails with
      # "Unable to find your web assets" otherwise.
      - name: Build the web app
        run: |
          npm ci
          npm run build -w @outliner/web

      - name: Install shell dependencies
        working-directory: apps/shell
        run: npm ci

      # --target universal-apple-darwin builds both slices and lipos them.
      - name: Build the app
        working-directory: apps/shell
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Report what was produced
        working-directory: apps/shell/src-tauri/target
        run: |
          # Bundles land in target/<triple>/release/bundle for a --target build
          # (here: universal-apple-darwin) and in target/release/bundle for a
          # host build. `find` handles both; a fixed glob does not.
          find . -name '*.dmg' -o -name 'Outliner.app' -type d | sort

      # Verify the bundle is real, without launching a GUI (this is what a
      # headless box cannot do; the runner has a display but no user).
      - name: Verify the .app bundle
        working-directory: apps/shell/src-tauri/target
        run: |
          set -eu
          # Works for both target/release/... and target/<triple>/release/...
          APP=$(find . -path '*/bundle/macos/Outliner.app' -type d | head -1)
          [ -n "$APP" ] || { echo "FAIL: no Outliner.app"; exit 1; }
          echo "app: $APP"
          # The executable is named after the Cargo binary ("outliner") but a
          # bundle may rename it to the product name; find whichever exists.
          BIN=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -u+x | head -1)
          [ -n "$BIN" ] || { echo "FAIL: no executable in Contents/MacOS"; exit 1; }
          echo "binary: $BIN"
          file "$BIN"
          plutil -lint "$APP/Contents/Info.plist"
          ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")
          echo "CFBundleIdentifier: $ID"
          [ "$ID" = "dev.outliner.app" ] || { echo "FAIL: wrong bundle id"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$APP/Contents/Info.plist"
          echo "architectures:"; lipo -archs "$BIN"
          DMG=$(find . -path '*/bundle/dmg/*.dmg' | head -1)
          [ -n "$DMG" ] || { echo "FAIL: no .dmg"; exit 1; }
          echo "dmg: $DMG ($(du -h "$DMG" | cut -f1))"

      - uses: actions/upload-artifact@v7
        with:
          name: outliner-macos-dmg
          # target/<triple>/release/bundle/dmg for --target builds
          path: apps/shell/src-tauri/target/**/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: outliner-macos-app
          # upload-artifact stores directories as a zip; preserve the app bundle
          path: apps/shell/src-tauri/target/**/bundle/macos/Outliner.app
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Linux: regression guard. The dev box already validates this; CI keeps it
  # true when the web app or the shell changes.
  # ---------------------------------------------------------------------------
  linux:
    name: Linux (.deb + .AppImage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/shell/src-tauri/target
          key: linux-cargo-${{ hashFiles('apps/shell/src-tauri/Cargo.lock') }}
          restore-keys: linux-cargo-

      # Tauri 2 on Linux needs WebKitGTK 4.1 and the rest of the GTK stack.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf

      - name: Build the web app
        run: |
          npm ci
          npm run build -w @outliner/web

      - name: Install shell dependencies
        working-directory: apps/shell
        run: npm ci

      - name: Build
        working-directory: apps/shell
        run: npm run tauri build -- --bundles deb,appimage

      - name: Verify the binaries are real
        working-directory: apps/shell/src-tauri/target/release
        run: |
          set -eu
          test -x outliner || { echo "FAIL: no executable"; exit 1; }
          file outliner
          # The web build must be inside the binary, not read from disk.
          strings outliner | grep -qE 'assets/index-[A-Za-z0-9_-]+\.js' \
            || { echo "FAIL: web assets not embedded"; exit 1; }
          echo "embedded: $(strings outliner | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | sort -u)"
          ls -la bundle/deb/*.deb bundle/appimage/*.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: outliner-linux
          path: |
            apps/shell/src-tauri/target/release/bundle/deb/*.deb
            apps/shell/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Android: debug APK. Not signed for release (no keystore), so this is for
  # device testing, not distribution.
  # ---------------------------------------------------------------------------
  android:
    name: Android (debug APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/shell/src-tauri/target
          key: android-cargo-${{ hashFiles('apps/shell/src-tauri/Cargo.lock') }}
          restore-keys: android-cargo-

      # ubuntu-24.04 already ships android-37.0, build-tools 37.0.0 and NDK
      # 27.3.13750724, with ANDROID_HOME / ANDROID_NDK_HOME exported. Report
      # them (so a runner-image change is visible in the log) and only install
      # what is missing -- downloading a matching NDK again costs minutes.
      - name: Check the Android SDK
        run: |
          set -eu
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK"
          echo "NDK_HOME=${NDK_HOME:-<unset>}"
          ls "$SDK/platforms" | sort
          ls "$SDK/build-tools" | sort
          ls "$SDK/ndk" 2>/dev/null || true
          # compileSdk 37 comes from gen/android/app/build.gradle.kts
          test -d "$SDK/platforms/android-37.0" || {
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
          }
          test -d "$SDK/build-tools/37.0.0" || {
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;37.0.0"
          }
          # Tauri reads NDK_HOME; the runner already sets it to its default NDK.
          # Only fall back to ANDROID_NDK_HOME if the image ever stops setting it.
          if [ -z "${NDK_HOME:-}" ]; then
            echo "NDK_HOME=${ANDROID_NDK_HOME:?neither NDK_HOME nor ANDROID_NDK_HOME is set}" >> "$GITHUB_ENV"
          fi

      - name: Build the web app
        run: |
          npm ci
          npm run build -w @outliner/web

      - name: Install shell dependencies
        working-directory: apps/shell
        run: npm ci

      # arm64 only: the APK that actually runs on phones. Building all four
      # ABIs takes 4x as long for images nobody installs.
      #
      # --debug, not --release: without a release keystore, `--release` produces
      # an *unsigned* APK that `adb install` refuses. The debug build is signed
      # with the throwaway debug key, so it installs for device testing. Swap to
      # --release once signing is configured (see the bottom of this file).
      - name: Build the APK
        working-directory: apps/shell
        run: npm run tauri android build -- --debug --apk --target aarch64

      - name: Verify the APK
        working-directory: apps/shell
        run: |
          set -eu
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APK=$(find src-tauri/gen/android -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "FAIL: no APK"; exit 1; }
          echo "apk: $APK ($(du -h "$APK" | cut -f1))"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          # `application-label:` with the colon only matches the default label;
          # without it the per-locale lines (application-label-af:, ...) flood the log.
          "$BT/aapt2" dump badging "$APK" \
            | grep -E '^(package:|minSdkVersion:|targetSdkVersion:|application-label:|native-code:)'
          # 16 KB page alignment is mandatory on Android 15's 16 KB-page devices;
          # build.rs passes -Wl,-z,max-page-size=16384 for that reason.
          "$BT/zipalign" -c -P 16 4 "$APK" >/dev/null || { echo "FAIL: not 16 KB aligned"; exit 1; }
          echo "OK: 16 KB aligned"
          # A debug APK must be signed, or adb install refuses it.
          "$BT/apksigner" verify "$APK" >/dev/null && echo "OK: signed (debug key)"

      - uses: actions/upload-artifact@v7
        with:
          name: outliner-android-apk
          path: apps/shell/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

# ---------------------------------------------------------------------------
# Enabling signing (not done here)
# ---------------------------------------------------------------------------
# macOS: add repository secrets APPLE_CERTIFICATE (base64 .p12),
# APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID,
# APPLE_PASSWORD, APPLE_TEAM_ID, then a step that imports the certificate into
# a temporary keychain before "Build the app". Tauri picks the identity up from
# the environment and notarizes automatically.
#
# Android: create a release keystore, store it base64 in secrets, decode it in
# a step, and add a `signingConfigs` block to
# apps/shell/src-tauri/gen/android/app/build.gradle.kts. Note that
# `tauri android init` regenerates that file, so a patch applied in CI is the
# durable approach.
#
# Until then, builds from this workflow are for testing only.
