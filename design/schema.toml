# Every entry the look has: its kind, what it changes, and its range. `base.toml`, the mode files and a user's
# appearance TOML hold values for these entries only (any subset; the base holds all of them).
#
# Kinds: `color` ("#rrggbb", "#rgb", "#rrggbbaa", "rgba(r, g, b, a)" or "transparent"), `length` (CSS pixels;
# "10pt" also allowed), `ratio` (a plain number: a factor of a size, or a line height), `weight` (100..900),
# `font` (a CSS font-family list), `choice` (one of `choices`). A color or font may hold `{table.key}` to use
# another entry's value ("{color.line}", "{font.ui}, Pretendard, sans-serif").
#
# `css` is the web's custom property (default `--<table>-<key>`, `_` as `-`). `design/build.mjs` writes
# `apps/web/src/design/tokens.css`, `apps/web/src/design/tokens.ts`, `native/crates/outliner-app/src/design.rs`
# and `design/schema.md` from these files.

[color]
scheme = { kind = "choice", choices = ["light", "dark"], css = "color-scheme", doc = "Light or dark form controls and scrollbars." }
