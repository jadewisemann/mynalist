[package]
name = "outliner-core"
description = "Outline tree, ops, undo and sync client: the Rust port of packages/core, wire-compatible with it."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
getrandom.workspace = true
# local time zone for date labels and recurrences (TZ, /etc/localtime, Android's tzdata)
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
